[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pcap-inspector"
version = "0.1.1"
description = "Minimal PCAP analyzer that extracts flow summaries and basic DNS/HTTP/TLS metadata."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "scapy==2.5.0",
]

[project.scripts]
pcap-inspector = "pcap_inspector.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
mypy_path = "src"
[[tool.mypy.overrides]]
module = ["scapy.*"]
ignore_missing_imports = true
